<body>
    <div class="container">
        <header data-lab-header data-title="Tetris 90s">
            <template data-slot="logo">
                🎮 Tetris 90s
            </template>
        </header>

        <div class="game-boy">
            <div class="screen-border">
                <div class="power-led"></div>
                <div class="screen-glass">
                    <div class="screen">
                        <div class="game-area">
                            <canvas id="tetris" width="200" height="400"></canvas>
                        </div>
                        <div class="sidebar">
                            <div class="score-box">
                                <div class="label">SCORE</div>
                                <div id="score">0</div>
                            </div>
                            <div class="level-box">
                                <div class="label">LEVEL</div>
                                <div id="level">1</div>
                            </div>
                            <div class="next-box">
                                <div class="label">NEXT</div>
                                <canvas id="next" width="80" height="80"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="brand">NINTENDO <span class="model">GAME BOY</span></div>
            </div>
            <div class="controls">
                <div class="d-pad">
                    <div class="up"></div>
                    <div class="right"></div>
                    <div class="down"></div>
                    <div class="left"></div>
                    <div class="center"></div>
                </div>
                <div class="action-buttons">
                    <div class="btn-group">
                        <div class="btn-a"></div>
                        <div class="label">A</div>
                    </div>
                    <div class="btn-group">
                        <div class="btn-b"></div>
                        <div class="label">B</div>
                    </div>
                </div>
                <div class="option-buttons">
                    <div class="btn-select"></div>
                    <div class="btn-start"></div>
                </div>
            </div>
            <div class="speaker">
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
            </div>
        </div>

        <div class="instructions">
            <p>Setas: Mover • Cima: Rodar • Espaço: Drop</p>
        </div>

        <footer data-lab-footer data-home-href="/"></footer>
    </div>

    <script src="/labs/shared.js?v=7" defer></script>
    <script src="script.js" defer></script>
</body>
