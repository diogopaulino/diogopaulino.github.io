    <meta property="og:description" content="Jogue Tetris clássico estilo anos 90 no seu navegador.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Tetris 90s | Diogo Paulino">

    <link rel="stylesheet" href="style.css?v=2">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebApplication",
          "name": "Tetris 90s",
          "url": "https://diogopaulino.com.br/labs/tetris/",
          "description": "Jogue Tetris clássico estilo anos 90 no seu navegador.",
          "applicationCategory": "GameApplication",
          "operatingSystem": "Any",
          "inLanguage": "pt-BR",
          "isAccessibleForFree": true,
          "author": {
            "@type": "Person",
            "name": "Diogo Paulino",
            "url": "https://diogopaulino.com.br/"
          },
          "image": "https://diogopaulino.com.br/assets/img/diogo.jpeg"
        },
        {
          "@type": "BreadcrumbList",
          "itemListElement": [
            {
              "@type": "ListItem",
              "position": 1,
              "name": "Diogo Paulino",
              "item": "https://diogopaulino.com.br/"
            },
            {
              "@type": "ListItem",
              "position": 2,
              "name": "Labs",
              "item": "https://diogopaulino.com.br/labs/"
            },
            {
              "@type": "ListItem",
              "position": 3,
              "name": "Tetris 90s",
              "item": "https://diogopaulino.com.br/labs/tetris/"
            }
          ]
        }
      ]
    }
    </script>
</head>

<body>
    <div class="container">
        <header data-lab-header data-title="Tetris 90s">
            <template data-slot="logo">
                🎮 Tetris 90s
            </template>
        </header>

        <div class="game-boy">
            <div class="screen-border">
                <div class="power-led"></div>
                <div class="screen-glass">
                    <div class="screen">
                        <div class="game-area">
                            <canvas id="tetris" width="200" height="400" role="img"
                                aria-label="Tabuleiro do Tetris"></canvas>
                        </div>
                        <div class="sidebar">
                            <div class="score-box">
                                <div class="label">SCORE</div>
                                <div id="score">0</div>
                            </div>
                            <div class="score-box">
                                <div class="label">HI</div>
                                <div id="highscore">0</div>
                            </div>
                            <div class="level-box">
                                <div class="label">LEVEL</div>
                                <div id="level">1</div>
                            </div>
                            <div class="level-box">
                                <div class="label">LINES</div>
                                <div id="lines">0</div>
                            </div>
                            <div class="next-box">
                                <div class="label">NEXT</div>
                                <canvas id="next" width="80" height="80" role="img"
                                    aria-label="Próxima peça"></canvas>
                            </div>
                        </div>
                        <!-- Overlay do estado do jogo: pronto, pausa e fim de jogo. -->
                        <div class="screen-overlay" id="overlay" role="status" aria-live="polite">
                            <p class="overlay-title" id="overlayTitle">TETRIS</p>
                            <p class="overlay-text" id="overlayText">START para jogar</p>
                        </div>
                    </div>
                </div>
                <div class="brand">NINTENDO <span class="model">GAME BOY</span></div>
            </div>
            <div class="controls">
                <div class="d-pad">
                    <button type="button" class="up" aria-label="Girar peça"></button>
                    <button type="button" class="right" aria-label="Mover para a direita"></button>
                    <button type="button" class="down" aria-label="Descer peça"></button>
                    <button type="button" class="left" aria-label="Mover para a esquerda"></button>
                    <div class="center" aria-hidden="true"></div>
                </div>
                <div class="action-buttons">
                    <div class="btn-group">
                        <button type="button" class="btn-b" aria-label="B: queda rápida"></button>
                        <div class="label" aria-hidden="true">B</div>
                    </div>
                    <div class="btn-group">
                        <button type="button" class="btn-a" aria-label="A: girar peça"></button>
                        <div class="label" aria-hidden="true">A</div>
                    </div>
                </div>
                <div class="option-buttons">
                    <div class="option-group">
                        <button type="button" class="btn-select" aria-label="Select: reiniciar partida"></button>
                        <div class="label" aria-hidden="true">SELECT</div>
                    </div>
                    <div class="option-group">
                        <button type="button" class="btn-start" aria-label="Start: jogar ou pausar"></button>
                        <div class="label" aria-hidden="true">START</div>
                    </div>
                </div>
            </div>
            <div class="speaker">
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
            </div>
        </div>

        <p id="gameStatus" class="sr-only" role="status" aria-live="polite"></p>

        <div class="instructions">
            <p class="touch-only"><strong>Arraste</strong> na tela para mover • <strong>para cima</strong> derruba •
                <strong>toque</strong> gira</p>
            <p><strong>Setas</strong> mover • <strong>Cima</strong> girar • <strong>Espaço</strong> queda rápida</p>
            <p><strong>Enter</strong> ou <strong>Start</strong> jogar/pausar • <strong>R</strong> reiniciar</p>
        </div>

        <footer data-lab-footer data-home-href="/"></footer>
    </div>

    <script src="/labs/shared.js?v=9" defer></script>
    <script src="script.js?v=2" defer></script>
</body>

</html>
