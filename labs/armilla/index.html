        rel="stylesheet">
    <link rel="stylesheet" href="/labs/shared.css?v=6">
    <link rel="stylesheet" href="style.css">

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
        }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebApplication",
          "name": "Armilla",
          "url": "https://diogopaulino.com.br/labs/armilla/",
          "description": "Esfera armilar em three.js que canta: plante estrelas nos anéis, escolha o modo e ouça a música das esferas.",
          "applicationCategory": "MultimediaApplication",
          "operatingSystem": "Any",
          "inLanguage": "pt-BR",
          "isAccessibleForFree": true,
          "author": {
            "@type": "Person",
            "name": "Diogo Paulino",
            "url": "https://diogopaulino.com.br/"
          },
          "image": "https://diogopaulino.com.br/assets/img/diogo.jpeg"
        },
        {
          "@type": "BreadcrumbList",
          "itemListElement": [
            {
              "@type": "ListItem",
              "position": 1,
              "name": "Diogo Paulino",
              "item": "https://diogopaulino.com.br/"
            },
            {
              "@type": "ListItem",
              "position": 2,
              "name": "Labs",
              "item": "https://diogopaulino.com.br/labs/"
            },
            {
              "@type": "ListItem",
              "position": 3,

              "item": "https://diogopaulino.com.br/labs/armilla/"
            }
          ]
        }
      ]
    }

</head>

<body>
    <main class="shell">
        <header data-lab-header data-title="Armilla" data-back-label="Labs">
            <template data-slot="logo">
                <div class="app-logo">
                    <span class="brand-mark" aria-hidden="true"></span>
                    <span>Armilla</span>
                </div>
            </template>
            <template data-slot="actions">
                <button id="playBtn" class="icon-btn" type="button" aria-pressed="true" title="Pausar (Espaço)"
                    aria-label="Tocar ou pausar">
                    <svg id="playIconPause" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <rect x="6" y="4" width="4" height="16" rx="1" />
                        <rect x="14" y="4" width="4" height="16" rx="1" />
                    </svg>
                    <svg id="playIconPlay" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"
                        style="display:none">
                        <path d="M8 5v14l11-7z" />
                    </svg>
                </button>
                <button id="rotateBtn" class="icon-btn" type="button" aria-pressed="true" title="Autorrotação (A)"
                    aria-label="Autorrotação da câmera">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12a9 9 0 1 1-3-6.7" />
                        <path d="M21 3v6h-6" />
                    </svg>
                </button>
                <button id="muteBtn" class="icon-btn" type="button" aria-pressed="false" title="Mudo (M)"
                    aria-label="Alternar som">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                    </svg>
                </button>
                <button id="fullscreen" class="icon-btn" type="button" aria-label="Tela cheia" title="Tela cheia (F)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path
                            d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
                    </svg>
                </button>
            </template>
        </header>

        <canvas id="scene" aria-label="Esfera armilar musical em 3D"></canvas>

        <div id="loading" class="loading" role="status">
            <div class="loading-orb" aria-hidden="true"></div>
            <p>Afinando as esferas…</p>
        </div>

        <aside class="hud-left" aria-label="Camadas da esfera">
            <p class="eyebrow">Musica universalis</p>
            <h2 id="presetName">Vésper</h2>
            <p class="meta-line" id="presetTag">Entardecer pentatônico</p>
            <div class="readout">
                <span><i>nota</i><strong id="noteNow">—</strong></span>
                <span><i>pulso</i><strong id="bpmRead">72 BPM</strong></span>
                <span><i>modo</i><strong id="modeRead">E Pentatônica</strong></span>
            </div>
            <div id="layerList" class="layers"></div>
            <p class="layer-hint">Duplo clique silencia a camada</p>
        </aside>

        <section class="hud-right" aria-label="Afinação">
            <p class="eyebrow">Afinação</p>
            <label class="field">
                <span>Escala</span>
                <select id="scaleSelect">
                    <option value="pentatonic">Pentatônica</option>
                    <option value="major">Jônia</option>
                    <option value="dorian">Dórica</option>
                    <option value="phrygian">Frígia</option>
                    <option value="mixolydian">Mixolídia</option>
                    <option value="minor">Eólia</option>
                </select>
            </label>
            <label class="field">
                <span>Tônica</span>
                <select id="rootSelect">
                    <option>C</option>
                    <option>D</option>
                    <option>E</option>
                    <option>F</option>
                    <option>G</option>
                    <option>A</option>
                    <option>B</option>
                </select>
            </label>
            <label class="field tempo">
                <span>Tempo <em id="tempoVal">72</em></span>
                <input id="tempo" type="range" min="48" max="140" value="72" step="1">
            </label>
            <div class="hud-actions">
                <button id="randomBtn" class="btn" type="button">Sortear</button>
                <button id="clearBtn" class="btn ghost" type="button">Limpar</button>
            </div>
        </section>

        <footer class="dock">
            <div id="presetRail" class="preset-rail" role="list"></div>
        </footer>

        <p id="listenHint" class="listen-hint">Toque para acordar o som</p>
        <p id="tooltip" class="tooltip" hidden>—</p>
        <p class="hint">Clique um anel para plantar uma estrela · arraste para orbitar · <kbd>Espaço</kbd> pausa ·
            <kbd>H</kbd> esconde UI</p>
        <p class="fps-badge" aria-hidden="true"><span id="fps">60</span> fps</p>
    </main>

    <script src="/labs/shared.js?v=6" defer></script>
    <script type="module" src="./src/main.js"></script>
</body>

</html>
