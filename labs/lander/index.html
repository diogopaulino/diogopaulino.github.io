<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunar Lander - Labs</title>
    <meta name="description" content="Pouso lunar com física realista: gravidade, inércia, consumo de combustível e terreno gerado por procedimento. Desça devagar e no ângulo certo.">
    <link rel="canonical" href="https://diogopaulino.com.br/labs/lander/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Diogo Paulino · Labs">
    <meta property="og:url" content="https://diogopaulino.com.br/labs/lander/">
    <meta property="og:title" content="Lunar Lander">
    <meta property="og:description" content="Pouso lunar com física realista: gravidade, inércia, consumo de combustível e terreno gerado por procedimento. Desça devagar e no ângulo certo.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Lunar Lander">
    <meta name="twitter:description" content="Pouso lunar com física realista: gravidade, inércia, consumo de combustível e terreno gerado por procedimento. Desça devagar e no ângulo certo.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/labs/shared.css?v=7">
    <link rel="stylesheet" href="style.css?v=4">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header data-lab-header data-title="Lunar Lander">
            <template data-slot="logo">
                🛸 Lunar Lander
            </template>
        </header>

        <main class="game-area">
            <!-- Windows 3.1 Window Frame -->
            <div class="win31-window">
                <div class="title-bar">
                    <div class="title-text">Lander</div>
                    <div class="window-controls" aria-hidden="true">
                        <span class="win-btn minimize">▼</span>
                        <span class="win-btn maximize">▲</span>
                    </div>
                </div>
                <div class="menu-bar">
                    <button id="btnNewGame" class="menu-item" type="button"><u>N</u>ew game</button>
                    <span class="menu-help">R: restart</span>
                </div>
                <div class="game-viewport">
                    <canvas id="gameCanvas" width="800" height="600"></canvas>

                    <!-- HUD Overlay -->
                    <div class="hud-layer">
                        <div class="hud-stats">
                            <div class="stat-row meta">
                                <span class="label">Mission</span>
                                <span class="value" id="hudMission">01</span>
                            </div>
                            <div class="stat-row meta">
                                <span class="label">Score</span>
                                <span class="value" id="hudScore">000000</span>
                            </div>
                            <div class="hud-separator"></div>
                            <div class="stat-row">
                                <span class="label">Altitude</span>
                                <span class="value" id="hudAlt">0</span>
                            </div>
                            <div class="stat-row">
                                <span class="label">Velocity X</span>
                                <span class="value" id="hudHSpeed">0.00</span>
                            </div>
                            <div class="stat-row">
                                <span class="label">Velocity Y</span>
                                <span class="value" id="hudVSpeed">0.00</span>
                            </div>
                            <div class="stat-row">
                                <span class="label">Angle</span>
                                <span class="value" id="hudAngle">+0°</span>
                            </div>
                            <div class="stat-row">
                                <span class="label">Fuel</span>
                                <span class="value" id="hudFuel">1000.00</span>
                            </div>
                            <div id="hudStatus" class="flight-status">READY</div>
                            <div class="safe-readout">SAFE: VX ≤ 24 · VY ≤ 34 · ±10°</div>
                        </div>

                        <!-- On-Screen Controls (Visual overlay matching screenshot) -->
                        <div class="onscreen-controls">
                            <div class="row">
                                <button id="btnLeft" class="win-btn control-btn"
                                    aria-label="Girar para a esquerda"
                                    title="Girar para a esquerda">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M14 7l-5 5 5 5V7z" />
                                    </svg>
                                </button>
                                <button id="btnRight" class="win-btn control-btn"
                                    aria-label="Girar para a direita"
                                    title="Girar para a direita">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M10 17l5-5-5-5v10z" />
                                    </svg>
                                </button>
                            </div>
                            <div class="row">
                                <button id="btnThrust" class="win-btn control-btn"
                                    aria-label="Propulsor principal"
                                    title="Propulsor principal">
                                    <!-- A down arrow with lines usually implies "Thrusting Down" (pushing up) in these old games UI -->
                                    <div class="thrust-icon">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                            <path d="M12 17L7 12h10l-5 5z" />
                                        </svg>
                                        <div class="thrust-lines">=</div>
                                    </div>
                                </button>
                            </div>
                        </div>

                        <div id="startMsg" class="center-msg">
                            <strong>LANDER</strong>
                            <small>↑/W/SPACE thrust · ←/→ rotate</small>
                            <small>Land level on a marked platform</small>
                            <button id="btnStart" class="start-button" type="button">PRESS SPACE / TAP TO START</button>
                        </div>
                        <div id="gameOverMsg" class="center-msg hidden">CRASHED<br><small>Press Space to restart</small></div>
                    </div>
                </div>
            </div>
        </main>

        <footer data-lab-footer data-home-href="/"></footer>
    </div>

    <script src="/labs/shared.js?v=7" defer></script>
    <script src="script.js?v=3" defer></script>
</body>

</html>
