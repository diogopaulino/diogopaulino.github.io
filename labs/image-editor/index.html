    <meta name="twitter:title" content="Image Editor — edição local no navegador | Diogo Paulino">
    <meta name="twitter:description" content="Editor de imagens no navegador: recorte, filtros, ajustes de brilho, contraste e saturação, tudo processado localmente sem enviar nada para servidor.">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="style.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebApplication",
          "name": "Image Editor",
          "url": "https://diogopaulino.com.br/labs/image-editor/",
          "description": "Editor de imagens no navegador: recorte, filtros, ajustes de brilho, contraste e saturação, tudo processado localmente sem enviar nada para servidor.",
          "applicationCategory": "UtilitiesApplication",
          "operatingSystem": "Any",
          "inLanguage": "pt-BR",
          "isAccessibleForFree": true,
          "author": {
            "@type": "Person",
            "name": "Diogo Paulino",
            "url": "https://diogopaulino.com.br/"
          },
          "image": "https://diogopaulino.com.br/assets/img/diogo.jpeg"
        },
        {
          "@type": "BreadcrumbList",
          "itemListElement": [
            {
              "@type": "ListItem",
              "position": 1,
              "name": "Diogo Paulino",
              "item": "https://diogopaulino.com.br/"
            },
            {
              "@type": "ListItem",
              "position": 2,
              "name": "Labs",
              "item": "https://diogopaulino.com.br/labs/"
            },
            {
              "@type": "ListItem",
              "position": 3,
              "name": "Image Editor",
              "item": "https://diogopaulino.com.br/labs/image-editor/"
            }
          ]
        }
      ]
    }
    </script>
</head>

<body>
    <div class="container">
        <header data-lab-header data-title="Image Editor">
            <template data-slot="logo">
                ✂️ Image Editor
            </template>
        </header>

        <main class="editor-container">
            <div class="editor-wrapper">
                <div class="preview-area" id="previewArea">
                    <div class="upload-placeholder" id="uploadPlaceholder">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                            <circle cx="8.5" cy="8.5" r="1.5" />
                            <polyline points="21 15 16 10 5 21" />
                        </svg>
                        <p>Clique ou arraste uma imagem</p>
                        <span class="upload-hint">ou cole com Ctrl+V</span>
                        <input type="file" id="fileInput" accept="image/*" aria-label="Selecionar imagem" hidden>

                        <div class="sample-gallery">
                            <span class="sample-gallery-label">ou experimente um exemplo</span>
                            <div class="sample-list" id="sampleList">
                                <button type="button" class="sample-item" data-sample="samples/sunset-horizon.jpg"
                                    style="background-image:url('samples/sunset-horizon.jpg')"
                                    aria-label="Carregar exemplo: pôr do sol"></button>
                                <button type="button" class="sample-item" data-sample="samples/city-dusk.jpg"
                                    style="background-image:url('samples/city-dusk.jpg')"
                                    aria-label="Carregar exemplo: skyline ao entardecer"></button>
                                <button type="button" class="sample-item" data-sample="samples/portrait-bust.jpg"
                                    style="background-image:url('samples/portrait-bust.jpg')"
                                    aria-label="Carregar exemplo: retrato"></button>
                                <button type="button" class="sample-item" data-sample="samples/abstract-blobs.jpg"
                                    style="background-image:url('samples/abstract-blobs.jpg')"
                                    aria-label="Carregar exemplo: abstrato"></button>
                            </div>
                        </div>
                    </div>
                    <canvas id="canvas" aria-label="Prévia da imagem em edição">
                        Prévia da imagem carregada para edição.
                    </canvas>
                    <span class="compare-hint" id="compareHint">Segure a imagem para comparar com o original</span>
                    <span class="image-dimensions-badge" id="imageDimensionsBadge" aria-live="polite" hidden></span>
                </div>

                <div class="controls-area" id="controlsArea">
                    <div class="tabs">
                        <button class="tab-btn active" data-tab="adjust">Ajustes</button>
                        <button class="tab-btn" data-tab="filters">Filtros</button>
                        <button class="tab-btn" data-tab="transform">Transformar</button>
                    </div>

                    <div class="tab-content active" id="adjust-tab">
                        <div class="slider-group">
                            <div class="slider-header">
                                <label for="brightness" title="Duplo clique para resetar">Brilho</label>
                                <span class="value">100%</span>
                            </div>
                            <input type="range" id="brightness" min="0" max="200" value="100" data-default="100" title="Duplo clique para resetar">
                        </div>
                        <div class="slider-group">
                            <div class="slider-header">
                                <label for="contrast" title="Duplo clique para resetar">Contraste</label>
                                <span class="value">100%</span>
                            </div>
                            <input type="range" id="contrast" min="0" max="200" value="100" data-default="100" title="Duplo clique para resetar">
                        </div>
                        <div class="slider-group">
                            <div class="slider-header">
                                <label for="saturation" title="Duplo clique para resetar">Saturação</label>
                                <span class="value">100%</span>
                            </div>
                            <input type="range" id="saturation" min="0" max="200" value="100" data-default="100" title="Duplo clique para resetar">
                        </div>
                        <div class="slider-group">
                            <div class="slider-header">
                                <label for="blur" title="Duplo clique para resetar">Desfoque</label>
                                <span class="value">0px</span>
                            </div>
                            <input type="range" id="blur" min="0" max="10" value="0" step="0.1" data-default="0" title="Duplo clique para resetar">
                        </div>
                    </div>

                    <div class="tab-content" id="filters-tab">
                        <div class="filters-filmstrip" id="filtersFilmstrip"></div>
                    </div>

                    <div class="tab-content" id="transform-tab">
                        <div class="transform-controls">
                            <button class="tool-btn" id="rotateLeft" title="Girar à esquerda">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                                    <path d="M3 3v5h5" />
                                </svg>
                                Girar Esq.
                            </button>
                            <button class="tool-btn" id="rotateRight" title="Girar à direita">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                                    <path d="M21 3v5h-5" />
                                </svg>
                                Girar Dir.
                            </button>
                            <button class="tool-btn" id="flipHorizontal" title="Espelhar horizontalmente">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M8 3H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h3" />
                                    <path d="M16 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3" />
                                    <path d="M12 20v2M12 14v2M12 8v2M12 2v2" />
                                </svg>
                                Espelhar H
                            </button>
                            <button class="tool-btn" id="flipVertical" title="Espelhar verticalmente">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v3" />
                                    <path d="M21 16v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3" />
                                    <path d="M4 12H2M10 12H8M16 12h-2M22 12h-2" />
                                </svg>
                                Espelhar V
                            </button>
                        </div>
                    </div>

                    <div class="actions">
                        <div class="actions-row">
                            <button class="btn secondary" id="resetBtn">Reset</button>
                            <button class="btn secondary" id="changeImageBtn">Trocar</button>
                            <button class="btn secondary" id="copyBtn">Copiar</button>
                        </div>
                        <div class="export-row">
                            <select id="exportFormatSelect" class="export-format-select" aria-label="Formato de exportação">
                                <option value="image/png" data-ext="png">PNG</option>
                                <option value="image/jpeg" data-ext="jpg">JPEG</option>
                                <option value="image/webp" data-ext="webp">WebP</option>
                            </select>
                            <button class="btn primary" id="saveBtn">Baixar Imagem</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer data-lab-footer data-home-href="/"></footer>
    </div>
    <script src="/labs/shared.js?v=14" defer></script>
    <script src="script.js?v=3" defer></script>
</body>

</html>
