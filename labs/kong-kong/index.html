<body class="kong-lab">
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>

  <div class="container">
    <header data-lab-header data-title="Kong Kong">
      <template data-slot="logo">
        <div class="app-logo">
          <span class="logo-mark" aria-hidden="true">◆</span>
          Kong Kong
        </div>
      </template>
    </header>

    <main class="stage-wrap">
      <section class="cabinet" aria-label="Jogo Kong Kong">
        <div class="rail rail-top" aria-hidden="true">
          <span></span>
          <strong>KK — ILHA DO LENÇO</strong>
          <span></span>
        </div>

        <div class="stage" id="stage">
          <canvas id="game" width="480" height="270" aria-label="Área do jogo Kong Kong">
            Seu navegador não oferece suporte a canvas.
          </canvas>
          <div class="vignette" aria-hidden="true"></div>

          <div class="hud-dock">
            <button class="icon-btn" id="muteBtn" type="button" aria-label="Desativar som" aria-pressed="false">♪</button>
            <button class="icon-btn" id="pauseBtn" type="button" aria-label="Pausar">Ⅱ</button>
          </div>

          <div class="touch-pad" id="touchPad" aria-label="Controles por toque">
            <div class="dpad">
              <button class="pad-btn" id="btnLeft" type="button" aria-label="Esquerda">←</button>
              <div class="dpad-mid">
                <button class="pad-btn pad-sm" id="btnUp" type="button" aria-label="Subir">▲</button>
                <button class="pad-btn pad-sm" id="btnDown" type="button" aria-label="Descer">▼</button>
              </div>
              <button class="pad-btn" id="btnRight" type="button" aria-label="Direita">→</button>
            </div>
            <div class="actions">
              <button class="pad-btn pad-roll" id="btnRoll" type="button" aria-label="Rolar">
                <span>ROLA</span>
              </button>
              <button class="pad-btn pad-jump" id="btnJump" type="button" aria-label="Pular">
                <span>PULA</span>
              </button>
            </div>
          </div>
        </div>

        <div class="rail rail-bottom">
          <p><strong>DICA</strong> O lenço vermelho é um hit extra. Role nos ouriços. Canhão: pule de novo para disparar.</p>
          <span class="sig">DIOGO LABS</span>
        </div>
      </section>

      <p class="help">
        <kbd>A</kbd><kbd>D</kbd> mover · <kbd>espaço</kbd> pular · <kbd>shift</kbd> rolar · <kbd>W</kbd> cipó · <kbd>S</kbd> entrar no barril
      </p>
    </main>

    <footer data-lab-footer data-home-href="/"></footer>
  </div>

  <p class="sr-only" id="announcer" aria-live="assertive"></p>
