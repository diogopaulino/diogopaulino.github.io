<body class="cartucho-lab">
    <div class="room" aria-hidden="true"></div>

    <div class="game-shell">
        <header data-lab-header data-title="Cartucho 16" data-back-href="/labs/" data-back-label="Labs">
            <template data-slot="logo">
                <div class="app-logo">
                    <span class="logo-mark" aria-hidden="true">■</span>
                    Cartucho 16
                </div>
            </template>
            <template data-slot="actions">
                <button type="button" class="hud-chip" id="crtBtn" aria-pressed="true" aria-label="Filtro CRT">CRT ON</button>
                <button type="button" class="hud-chip" id="muteBtn" aria-pressed="false" aria-label="Som">SOM ON</button>
            </template>
        </header>

        <main class="stage" aria-label="Jogo Cartucho 16">
            <div class="tv" id="crt">
                <div class="tv-bezel">
                    <div class="tv-brand" aria-hidden="true">PIXELTON</div>
                    <div class="screen-wrap">
                        <canvas id="game" width="256" height="224" aria-label="Tela 16-bit de Cartucho 16">
                            Seu navegador não oferece suporte a canvas.
                        </canvas>
                        <div class="scanlines" aria-hidden="true"></div>
                        <div class="vignette" aria-hidden="true"></div>
                    </div>
                    <div class="tv-led" aria-hidden="true"></div>
                </div>
                <p class="sr-only">Setas ou WASD para andar, Z ou espaço para pular, X para atacar, Shift para dash, Enter para start, Esc para pausar. Código Konami libera 30 vidas.</p>
            </div>

            <div class="console" aria-hidden="true">
                <div class="cart-slot">
                    <span class="cart"></span>
                </div>
                <div class="console-label">SUPER PIXEL · 16-BIT</div>
            </div>

            <div class="touch" aria-label="Controles por toque">
                <div class="touch-dpad">
                    <button type="button" class="pad" data-pad="left" aria-label="Esquerda">◀</button>
                    <div class="touch-vert">
                        <button type="button" class="pad" data-pad="up" aria-label="Cima">▲</button>
                        <button type="button" class="pad" data-pad="down" aria-label="Baixo">▼</button>
                    </div>
                    <button type="button" class="pad" data-pad="right" aria-label="Direita">▶</button>
                </div>
                <div class="touch-actions">
                    <button type="button" class="pad pad-start" data-pad="start" aria-label="Start">ST</button>
                    <button type="button" class="pad pad-atk" data-pad="attack" aria-label="Atacar">ATK</button>
                    <button type="button" class="pad pad-jump" data-pad="jump" aria-label="Pular">A</button>
                </div>
            </div>
        </main>

        <footer data-lab-footer data-home-href="/"></footer>
    </div>

    <script src="/labs/shared.js?v=7" defer></script>
    <script type="module" src="src/main.js"></script>
