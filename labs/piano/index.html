<body>
  <div class="container">
    <header data-lab-header data-fullscreen data-title="Piano">
      <template data-slot="logo">
        🎹 Piano
      </template>
    </header>

    <main class="piano-stage" aria-labelledby="piano-title">
      <h1 id="piano-title" class="sr-only">Piano de 49 teclas</h1>

      <button type="button" id="audio-status" class="audio-status" data-state="idle">
        <span class="audio-status-dot" aria-hidden="true"></span>
        <span class="audio-status-body" aria-live="polite">
          <span class="audio-status-text">Toque em uma tecla para ligar o som.</span>
          <small class="audio-status-extra" hidden></small>
        </span>
      </button>

      <div class="piano-case">
        <div class="piano-fallboard" aria-hidden="true">
          <span class="fallboard-brand">Diogo Paulino</span>
          <span class="fallboard-model">Concert · 49</span>
        </div>
        <div class="piano-wrapper">
          <div class="piano" id="piano" role="application"
            aria-label="Teclado de piano. Toque nas teclas ou use o teclado do computador."></div>
        </div>
      </div>

      <div class="keyboard-map" id="keyboard-map" tabindex="0" role="slider" aria-label="Navegar pelo teclado"
        aria-valuemin="0" aria-valuemax="100" hidden>
        <span class="keyboard-map-window" id="keyboard-map-window" aria-hidden="true"></span>
      </div>
    </main>

    <section class="controls" aria-label="Controles do piano">
      <div class="control-group pedal-group">
        <button id="sustain-btn" class="sustain-btn" type="button" aria-pressed="false"
          title="Pedal de sustain (segure Espaço)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 18h14l-2-5H7l-2 5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
            <path d="M12 13V5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <span class="sustain-label">Sustain</span>
        </button>
        <button id="sustain-lock-btn" class="chip-btn" type="button" aria-pressed="false"
          title="Travar o pedal (ideal no celular)">
          <span class="lock-dot" aria-hidden="true"></span>
          <span>Travar</span>
        </button>
      </div>

      <div class="control-group sliders-group">
        <label class="slider">
          <span class="slider-label">Volume</span>
          <input type="range" id="volume" min="0" max="100" value="75" aria-label="Volume">
          <output id="volume-value" for="volume">75%</output>
        </label>
        <label class="slider">
          <span class="slider-label">Dinâmica</span>
          <input type="range" id="dynamic" min="0" max="5" step="1" value="3"
            aria-label="Dinâmica do teclado do computador (↑ ↓)">
          <output id="dynamic-value" for="dynamic">mf</output>
        </label>
        <label class="slider">
          <span class="slider-label">Sala</span>
          <input type="range" id="reverb" min="0" max="100" value="30" aria-label="Reverberação da sala">
          <output id="reverb-value" for="reverb">30%</output>
        </label>
      </div>

      <div class="control-group octave-group" role="group" aria-label="Oitava do teclado do computador">
        <button id="octave-down" class="octave-btn" type="button" aria-label="Oitava abaixo (←)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <span id="octave-display" class="octave-display">C3–G5</span>
        <button id="octave-up" class="octave-btn" type="button" aria-label="Oitava acima (→)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="m6 3 5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <button id="midi-btn" class="chip-btn midi-btn" type="button" title="Conectar um teclado MIDI (USB/Bluetooth)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" />
            <circle cx="8" cy="11" r="1.2" fill="currentColor" />
            <circle cx="16" cy="11" r="1.2" fill="currentColor" />
            <circle cx="12" cy="8" r="1.2" fill="currentColor" />
            <circle cx="12" cy="15" r="1.2" fill="currentColor" />
          </svg>
          <span>MIDI</span>
        </button>
      </div>
    </section>

    <div class="instructions">
      <p class="hint-touch">Deslize entre as teclas para glissando · perto da borda = mais forte · arraste a faixa
        acima dos controles para navegar</p>
      <p class="hint-keys"><kbd>Z</kbd>–<kbd>M</kbd> e <kbd>Q</kbd>–<kbd>]</kbd> tocam · <kbd>Espaço</kbd> sustain ·
        <kbd>←</kbd><kbd>→</kbd> oitava · <kbd>↑</kbd><kbd>↓</kbd> dinâmica</p>
    </div>

    <footer data-lab-footer data-home-href="/"></footer>
