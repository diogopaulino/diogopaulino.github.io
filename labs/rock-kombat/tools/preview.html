<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Rock Kombat — rig preview</title>
  <style>
    body { margin: 0; padding: 18px; background: #14101a; color: #e8e2ee;
           font: 13px/1.5 ui-monospace, Menlo, monospace; }
    h1 { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: #ffc44d; }
    .row { margin-bottom: 6px; }
    .row h2 { font-size: 11px; letter-spacing: .12em; color: #6acfa0; margin: 10px 0 2px; }
    canvas { background: #221b2b; vertical-align: top; }
    .live canvas { background: #0d0a12; }
  </style>
</head>

<body>
  <h1>Rig preview</h1>
  <p>Every keyframe of every clip, plus a live loop. Use this to check the rig
    after editing <code>tools/rig.py</code> or <code>tools/clips.py</code>.</p>
  <div id="out"></div>

  <script src="../rig.js"></script>
  <script>
    const SCALE = 0.42;

    RockKombatRig.load('../assets/atlas.json', '../assets/').then(({ fighters, clips, Animator }) => {
      const out = document.getElementById('out');

      for (const id of Object.keys(fighters)) {
        const rig = fighters[id];
        const w = Math.round(rig.width * SCALE);
        const h = Math.round(rig.height * SCALE);

        const title = document.createElement('h2');
        title.textContent = id;
        out.append(title);

        // Live loop through every clip, one after another.
        const live = document.createElement('div');
        live.className = 'row live';
        const liveCanvas = document.createElement('canvas');
        liveCanvas.width = w * 2;
        liveCanvas.height = h * 2;
        live.append(liveCanvas);
        out.append(live);

        const anim = new Animator(clips);
        const names = Object.keys(clips);
        let which = 0;
        let held = 0;
        const lctx = liveCanvas.getContext('2d');

        (function tick() {
          anim.update();
          if (++held > 90) { held = 0; which = (which + 1) % names.length; anim.play(names[which], true); }
          const s = anim.sample();
          rig.compose(s.pose, s.front);
          lctx.clearRect(0, 0, liveCanvas.width, liveCanvas.height);
          lctx.drawImage(rig.buffer, 0, 0, liveCanvas.width, liveCanvas.height);
          requestAnimationFrame(tick);
        })();

        // Static strip of every keyframe.
        for (const name of names) {
          const row = document.createElement('div');
          row.className = 'row';
          const label = document.createElement('h2');
          label.textContent = name + '  (' + clips[name].frames.length + ' keyframes, ' +
            (clips[name].loop ? 'loop' : 'once') + ')';
          out.append(label);

          clips[name].frames.forEach((frame, i) => {
            const cv = document.createElement('canvas');
            cv.width = w;
            cv.height = h;
            rig.compose(frame.pose, frame.front);
            cv.getContext('2d').drawImage(rig.buffer, 0, 0, w, h);
            cv.title = name + ' #' + i;
            row.append(cv);
          });
          out.append(row);
        }
      }
    }).catch(err => {
      document.getElementById('out').textContent = 'load failed: ' + err.message;
    });
  </script>
</body>

</html>
