<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Ravi 1·2·3: A Grande Festa Surpresa</title>
  <meta name="description"
    content="Ajude o Ravi a preparar uma festa surpresa para guerreiros e heróis! Jogo educativo de números 1 a 9 inspirado nos clássicos dos anos 90.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://diogopaulino.com.br/labs/ravi-123/">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://diogopaulino.com.br/labs/ravi-123/">
  <meta property="og:title" content="Ravi 1·2·3: A Grande Festa Surpresa">
  <meta property="og:description"
    content="Conte de 1 a 9 e ajude o Ravi a convidar heróis para a maior festa surpresa do reino.">
  <meta property="og:locale" content="pt_BR">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
</head>

<body>
  <div id="app">
    <canvas id="game" width="640" height="400" aria-label="Ravi 1·2·3"></canvas>

    <div id="hud">
      <button id="btn-back" class="hud-btn" type="button" title="Voltar aos labs" aria-label="Voltar">←</button>
      <div id="speech-bubble" class="hidden" aria-live="polite"></div>
      <button id="btn-fs" class="hud-btn" type="button" title="Tela cheia" aria-label="Tela cheia">⛶</button>
    </div>

    <div id="flashcard" class="hidden" aria-hidden="true">
      <span id="flash-num">1</span>
    </div>

    <div id="choice-panel" class="hidden">
      <p id="choice-prompt"></p>
      <div id="choice-grid"></div>
    </div>

    <div id="numpad">
      <button type="button" class="num-key" data-n="1">1</button>
      <button type="button" class="num-key" data-n="2">2</button>
      <button type="button" class="num-key" data-n="3">3</button>
      <button type="button" class="num-key" data-n="4">4</button>
      <button type="button" class="num-key" data-n="5">5</button>
      <button type="button" class="num-key" data-n="6">6</button>
      <button type="button" class="num-key" data-n="7">7</button>
      <button type="button" class="num-key" data-n="8">8</button>
      <button type="button" class="num-key" data-n="9">9</button>
      <button type="button" class="num-key num-zero" data-n="0">0</button>
    </div>

    <div id="title-overlay" class="overlay">
      <div class="title-card">
        <p class="eyebrow">Clássico educativo · anos 90</p>
        <h1>Ravi <span>1·2·3</span></h1>
        <h2>A Grande Festa Surpresa</h2>
        <p class="hint">Aperte qualquer número para acordar o Ravi!</p>
        <div class="title-keys">
          <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
          <span>6</span><span>7</span><span>8</span><span>9</span>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="main.js?v=3"></script>
</body>

</html>
