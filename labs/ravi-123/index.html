<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ravi 1·2·3: A Grande Festa Surpresa - Labs</title>
  <meta name="description"
    content="Aventura infantil em pixel art no estilo dos CD-ROMs educativos de 1991: ajude o Ravi a escolher um veículo, convidar amigos e animais, fazer compras, pegar brinquedos na fábrica e montar a maior festa de aniversário do bairro.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://diogopaulino.com.br/labs/ravi-123/">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://diogopaulino.com.br/labs/ravi-123/">
  <meta property="og:title" content="Ravi 1·2·3: A Grande Festa Surpresa">
  <meta property="og:description"
    content="Aventura infantil em pixel art estilo 1991: veículos, amigos, animais, mercado, fábrica de brinquedos e uma festa inteira.">
  <meta property="og:locale" content="pt_BR">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/labs/shared.css?v=4">
  <link rel="stylesheet" href="style.css?v=1">

  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div class="container">
    <header data-lab-header data-title="Ravi 1·2·3" data-back-href="/labs/" data-back-label="Labs">
      <template data-slot="logo">
        <h1>Ravi 1·2·3</h1>
      </template>
    </header>

    <main class="stage-wrap">
      <!--
        Moldura de monitor CRT bege (padrão dos PCs 386/486 de 1991).
        A "tela" tem espaço lógico fixo de 640x480 e é escalada por JS (--screen-scale)
        para caber no viewport sem quebrar a proporção 4:3.
      -->
      <div class="crt" id="crt">
        <div class="crt-bezel">
          <div class="crt-viewport" id="viewport">
            <div class="screen" id="screen">
              <canvas class="screen-bg" id="bg" width="320" height="240" aria-hidden="true"></canvas>
              <div class="layer layer-world" id="world" aria-hidden="true"></div>
              <div class="layer layer-fx" id="fx" aria-hidden="true"></div>
              <div class="layer layer-ui" id="ui"></div>
              <div class="screen-glass" aria-hidden="true"></div>
              <div class="screen-scanlines" aria-hidden="true"></div>
            </div>
          </div>
        </div>
        <div class="crt-chin">
          <span class="crt-brand">RaviVision <b>1024</b></span>
          <span class="crt-controls" aria-hidden="true">
            <span class="crt-led" id="crtLed"></span>
            <span class="crt-knob"></span>
            <span class="crt-knob"></span>
          </span>
        </div>
      </div>

      <p class="stage-hint" id="stageHint">
        Clique / toque para jogar &nbsp;·&nbsp; <kbd>1</kbd>–<kbd>9</kbd> escolhem números &nbsp;·&nbsp;
        <kbd>Esc</kbd> abre o menu
      </p>
    </main>

    <footer data-lab-footer data-home-href="/"></footer>
  </div>

  <script src="/labs/shared.js?v=3" defer></script>
  <script src="art.js?v=1" defer></script>
  <script src="audio.js?v=1" defer></script>
  <script src="game.js?v=1" defer></script>
</body>

</html>
