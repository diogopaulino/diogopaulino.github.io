    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebApplication",
          "name": "Retro Snake",
          "url": "https://diogopaulino.com.br/labs/snake/",
          "description": "Snake retrô em um console portátil 8-bit: colete frutas, ganhe velocidade e bata o seu recorde direto no navegador.",

          "operatingSystem": "Any",
          "inLanguage": "pt-BR",
          "isAccessibleForFree": true,
          "author": {

            "name": "Diogo Paulino",
            "url": "https://diogopaulino.com.br/"
          },
          "image": "https://diogopaulino.com.br/assets/img/diogo.jpeg"
        },
        {
          "@type": "BreadcrumbList",
          "itemListElement": [
            {
              "@type": "ListItem",
              "position": 1,
              "name": "Diogo Paulino",
              "item": "https://diogopaulino.com.br/"
            },
            {
              "@type": "ListItem",
              "position": 2,
              "name": "Labs",
              "item": "https://diogopaulino.com.br/labs/"
            },
            {
              "@type": "ListItem",
              "position": 3,

              "item": "https://diogopaulino.com.br/labs/snake/"
            }
          ]
        }
      ]
    }

<body>
    <div class="container">
        <header data-lab-header data-title="Retro Snake">
            <template data-slot="logo">
                🐍 Retro Snake
            </template>
        </header>

        <main class="game-container">
            <div class="handheld-device">
                <div class="screen-bezel">
                    <div class="screen-glass">
                        <div class="lcd-hud" aria-hidden="true">
                            <span class="lcd-item"><span class="lcd-key">SC</span><span id="hudScore">000</span></span>
                            <span class="lcd-item"><span class="lcd-key">HI</span><span id="hudBest">000</span></span>
                        </div>
                        <div class="screen-play">
                            <canvas id="gameCanvas" width="400" height="400" role="img"
                                aria-label="Tabuleiro do jogo Snake"></canvas>
                            <div class="ui-overlay" id="startScreen">
                                <h2>SNAKE</h2>
                                <p>Pressione Start</p>
                            </div>
                            <div class="ui-overlay hidden" id="pauseScreen">
                                <h2>PAUSA</h2>
                                <p>Start p/ voltar</p>
                            </div>
                            <div class="ui-overlay hidden" id="gameOverScreen">
                                <h2>FIM DE JOGO</h2>
                                <p class="steady">Pontos: <span id="finalScore">0</span></p>
                                <p>Pressione Start</p>
                            </div>
                            <div class="scanlines"></div>
                        </div>
                    </div>
                    <div class="power-led"></div>
                    <div class="brand-text">NINTENDO-ISH</div>
                </div>

                <div class="controls-area">
                    <div class="d-pad">
                        <button type="button" class="d-pad-up" data-key="ArrowUp" aria-label="Mover para cima"></button>
                        <button type="button" class="d-pad-right" data-key="ArrowRight"
                            aria-label="Mover para a direita"></button>
                        <button type="button" class="d-pad-down" data-key="ArrowDown"
                            aria-label="Mover para baixo"></button>
                        <button type="button" class="d-pad-left" data-key="ArrowLeft"
                            aria-label="Mover para a esquerda"></button>
                        <div class="d-pad-center" aria-hidden="true"></div>
                    </div>

                    <div class="action-buttons">
                        <div class="btn-group">
                            <button type="button" class="btn-b" id="btnB" aria-label="Botão B: pausar ou retomar"><span
                                    class="sr-only">B</span></button>
                            <div class="label" aria-hidden="true">B</div>
                        </div>
                        <div class="btn-group">
                            <button type="button" class="btn-a" id="btnA" aria-label="Botão A: iniciar partida"><span
                                    class="sr-only">A</span></button>
                            <div class="label" aria-hidden="true">A</div>
                        </div>
                    </div>

                    <div class="meta-controls">
                        <div class="meta-btn-group">
                            <button type="button" class="btn-select" id="btnSelect"
                                aria-label="Select: reiniciar partida"></button>
                            <div class="label" aria-hidden="true">SELECT</div>
                        </div>
                        <div class="meta-btn-group">
                            <button type="button" class="btn-start" id="btnStart"
                                aria-label="Start: jogar ou pausar"></button>
                            <div class="label" aria-hidden="true">START</div>
                        </div>
                    </div>

                    <div class="speaker-grill" aria-hidden="true">
                        <span></span><span></span><span></span><span></span><span></span><span></span>
                    </div>
                </div>
            </div>

            <p id="gameStatus" class="sr-only" role="status" aria-live="polite"></p>

            <div class="instructions">
                <p>Use as <strong>Setas</strong> ou o <strong>D-Pad</strong> para mover</p>
                <p>Pressione <strong>Enter</strong> ou <strong>Start</strong> para Jogar/Pausar</p>
            </div>
        </main>

        <footer data-lab-footer data-home-href="/"></footer>
    </div>

    <script src="/labs/shared.js?v=7" defer></script>
    <script src="script.js?v=2" defer></script>
</body>

</html>
