<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulsar - Diogo Paulino</title>
    <meta name="description"
        content="Instrumento musical generativo: toque na tela para criar orbes que pulsam, se conectam e compõem música ambiente sozinhos.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/labs/shared.css?v=4">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header data-lab-header data-title="Pulsar">
            <template data-slot="logo">
                <div class="app-logo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="2.2" />
                        <path d="M12 5.5a6.5 6.5 0 0 1 6.5 6.5" opacity="0.85" />
                        <path d="M12 2a10 10 0 0 1 10 10" opacity="0.5" />
                        <path d="M5.5 12A6.5 6.5 0 0 1 12 5.5" opacity="0.85" />
                        <path d="M2 12A10 10 0 0 1 12 2" opacity="0.5" />
                    </svg>
                    Pulsar
                </div>
            </template>
            <template data-slot="actions">
                <button id="muteBtn" class="icon-btn" aria-label="Mudo" title="Mudo">
                    <svg class="icon-sound" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14" opacity="0.6" />
                    </svg>
                    <svg class="icon-mute" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        style="display:none">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                        <line x1="23" y1="9" x2="17" y2="15" />
                        <line x1="17" y1="9" x2="23" y2="15" />
                    </svg>
                </button>
                <button id="fullscreen" class="icon-btn" aria-label="Tela cheia" title="Tela cheia">
                    <svg class="fullscreen-enter" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <path
                            d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
                    </svg>
                    <svg class="fullscreen-exit" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" style="display:none">
                        <path
                            d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3" />
                    </svg>
                </button>
            </template>
        </header>

        <canvas id="canvas"></canvas>

        <button id="toggleControls" class="toggle-controls-btn" aria-label="Mostrar/esconder controles">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path
                    d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
                <circle cx="12" cy="12" r="3" />
            </svg>
        </button>

        <div class="controls">
            <div class="controls-header">
                <span>Configurações</span>
                <button id="closeControls" class="close-btn" aria-label="Fechar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <div class="controls-scroll">
                <div class="control-section">
                    <div class="section-title">Escala Musical</div>
                    <div class="pill-grid" id="scaleGrid">
                        <button class="pill-btn active" data-scale="pentatonic">Pentatônica</button>
                        <button class="pill-btn" data-scale="major">Maior</button>
                        <button class="pill-btn" data-scale="minor">Menor</button>
                        <button class="pill-btn" data-scale="dorian">Dórica</button>
                        <button class="pill-btn" data-scale="wholetone">Tons Inteiros</button>
                    </div>
                </div>

                <div class="control-section">
                    <div class="section-title">Tônica</div>
                    <div class="pill-grid notes-grid" id="rootGrid">
                        <button class="pill-btn" data-root="C">C</button>
                        <button class="pill-btn" data-root="D">D</button>
                        <button class="pill-btn active" data-root="E">E</button>
                        <button class="pill-btn" data-root="G">G</button>
                        <button class="pill-btn" data-root="A">A</button>
                    </div>
                </div>

                <div class="control-section">
                    <div class="section-title">Tema de Cores</div>
                    <div class="color-grid">
                        <button class="color-swatch active" data-theme="nebula" title="Nebula">
                            <span style="background: linear-gradient(135deg, #22d3ee, #a855f7, #f472b6)"></span>
                            <small>Nébula</small>
                        </button>
                        <button class="color-swatch" data-theme="aurora" title="Aurora">
                            <span style="background: linear-gradient(135deg, #00ff88, #00d4ff, #8b5cf6)"></span>
                            <small>Aurora</small>
                        </button>
                        <button class="color-swatch" data-theme="sunset" title="Sunset">
                            <span style="background: linear-gradient(135deg, #ff6b6b, #feca57, #ff9ff3)"></span>
                            <small>Sunset</small>
                        </button>
                        <button class="color-swatch" data-theme="deep" title="Deep">
                            <span style="background: linear-gradient(135deg, #0066ff, #6366f1, #22d3ee)"></span>
                            <small>Deep</small>
                        </button>
                    </div>
                </div>

                <div class="control-section">
                    <div class="section-title">Timbre</div>
                    <div class="select-group">
                        <select id="waveform">
                            <option value="sine" selected>Suave (Sine)</option>
                            <option value="triangle">Quente (Triangle)</option>
                            <option value="soft-saw">Cristalino (Saw filtrado)</option>
                        </select>
                    </div>
                </div>

                <div class="control-section">
                    <div class="section-title">Ajustes</div>
                    <div class="sliders-grid">
                        <div class="slider-group">
                            <div class="slider-header">
                                <label>Ritmo</label>
                                <span class="slider-value" id="tempoValue">1.0×</span>
                            </div>
                            <input type="range" id="tempo" min="0.3" max="2.5" step="0.1" value="1">
                        </div>
                        <div class="slider-group">
                            <div class="slider-header">
                                <label>Espaço (reverb)</label>
                                <span class="slider-value" id="reverbValue">45%</span>
                            </div>
                            <input type="range" id="reverb" min="0" max="100" step="1" value="45">
                        </div>
                        <div class="slider-group">
                            <div class="slider-header">
                                <label>Alcance</label>
                                <span class="slider-value" id="reachValue">100%</span>
                            </div>
                            <input type="range" id="reach" min="40" max="160" step="5" value="100">
                        </div>
                        <div class="slider-group">
                            <div class="slider-header">
                                <label>Volume</label>
                                <span class="slider-value" id="volumeValue">80%</span>
                            </div>
                            <input type="range" id="volume" min="0" max="100" step="1" value="80">
                        </div>
                    </div>
                </div>

                <div class="control-section">
                    <div class="section-title">Drone Ambiente</div>
                    <button id="droneToggle" class="drone-toggle" aria-pressed="false">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 18V5l12-2v13" />
                            <circle cx="6" cy="18" r="3" />
                            <circle cx="18" cy="16" r="3" />
                        </svg>
                        <span>Ligar camada de fundo</span>
                    </button>
                </div>

                <div class="control-footer">
                    <div class="action-buttons">
                        <button id="clear" class="action-btn reset-btn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M3 6h18" />
                                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                            </svg>
                            Limpar
                        </button>
                    </div>
                    <div class="stats-bar">
                        <div class="stat">
                            <span class="stat-value" id="orbCount">0</span>
                            <span class="stat-label">orbes</span>
                        </div>
                        <div class="stat-divider"></div>
                        <div class="stat">
                            <span class="stat-value" id="noteCount">0</span>
                            <span class="stat-label">notas</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="instructions">
            <p>Toque na tela para criar orbes. Eles pulsam sozinhos e ativam vizinhos próximos.</p>
            <p class="sub">Arraste para mover · toque duplo para apagar</p>
        </div>

        <footer data-lab-footer data-home-href="/"></footer>
    </div>

    <script src="/labs/shared.js?v=5" defer></script>
    <script src="script.js" defer></script>
</body>

</html>
