<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulsar - Diogo Paulino</title>
    <meta name="description"
        content="Instrumento musical generativo: toque na tela para criar orbes que pulsam, se conectam e compõem música ambiente sozinhos.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/labs/shared.css?v=4">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header data-lab-header data-title="Pulsar">
            <template data-slot="logo">
                <div class="app-logo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="2.2" />
                        <path d="M12 5.5a6.5 6.5 0 0 1 6.5 6.5" opacity="0.85" />
                        <path d="M12 2a10 10 0 0 1 10 10" opacity="0.5" />
                        <path d="M5.5 12A6.5 6.5 0 0 1 12 5.5" opacity="0.85" />
                        <path d="M2 12A10 10 0 0 1 12 2" opacity="0.5" />
                    </svg>
                    Pulsar
                </div>
            </template>
            <template data-slot="actions">
                <button id="muteBtn" class="icon-btn" aria-label="Mudo" title="Mudo">
                    <svg class="icon-sound" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14" opacity="0.6" />
                    </svg>
                    <svg class="icon-mute" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        style="display:none">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                        <line x1="23" y1="9" x2="17" y2="15" />
                        <line x1="17" y1="9" x2="23" y2="15" />
                    </svg>
                </button>
                <button id="fullscreen" class="icon-btn" aria-label="Tela cheia" title="Tela cheia">
                    <svg class="fullscreen-enter" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <path
                            d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
                    </svg>
                    <svg class="fullscreen-exit" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" style="display:none">
                        <path
                            d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3" />
                    </svg>
                </button>
            </template>
        </header>

        <canvas id="canvas"></canvas>



        <div class="dock">
            <div class="dock-group" data-tooltip="Tônica (Raiz)">
                <div class="dock-pills" id="rootGrid">
                    <button class="pill-mini active" data-root="C">C</button>
                    <button class="pill-mini" data-root="D">D</button>
                    <button class="pill-mini active" data-root="E">E</button>
                    <button class="pill-mini" data-root="G">G</button>
                    <button class="pill-mini" data-root="A">A</button>
                </div>
            </div>

            <div class="dock-separator"></div>

            <div class="dock-group" data-tooltip="Escala">
                <div class="dock-pills" id="scaleGrid">
                    <button class="pill-mini active" data-scale="pentatonic">PEN</button>
                    <button class="pill-mini" data-scale="major">MAJ</button>
                    <button class="pill-mini" data-scale="minor">MIN</button>
                    <button class="pill-mini" data-scale="dorian">DOR</button>
                    <button class="pill-mini" data-scale="wholetone">WT</button>
                </div>
            </div>

            <div class="dock-separator"></div>

            <div class="dock-group color-dock" data-tooltip="Tema Visual">
                <button class="swatch-mini active" data-theme="nebula" style="background: linear-gradient(135deg, #22d3ee, #a855f7, #f472b6)"></button>
                <button class="swatch-mini" data-theme="aurora" style="background: linear-gradient(135deg, #00ff88, #00d4ff, #8b5cf6)"></button>
                <button class="swatch-mini" data-theme="sunset" style="background: linear-gradient(135deg, #ff6b6b, #feca57, #ff9ff3)"></button>
                <button class="swatch-mini" data-theme="deep" style="background: linear-gradient(135deg, #0066ff, #6366f1, #22d3ee)"></button>
            </div>

            <div class="dock-separator"></div>

            <div class="dock-group" data-tooltip="Timbre da Onda">
                <button class="icon-btn" id="waveformCycle">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12h4l3-9 5 18 3-9h3" />
                    </svg>
                </button>
            </div>
            
            <div class="dock-separator"></div>

            <div class="dock-group sliders-group">
                <div class="slider-mini" data-tooltip="Ritmo">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <input type="range" id="tempo" min="0.3" max="2.5" step="0.1" value="1">
                </div>
                <div class="slider-mini" data-tooltip="Espaço (Reverb)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h4l2-3 4 6 2-3h4"/></svg>
                    <input type="range" id="reverb" min="0" max="100" step="1" value="45">
                </div>
                <div class="slider-mini" data-tooltip="Volume">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14" opacity="0.6"/></svg>
                    <input type="range" id="volume" min="0" max="100" step="1" value="80">
                </div>
            </div>

            <div class="dock-separator"></div>

            <div class="dock-group actions-dock">
                <button id="droneToggle" class="icon-btn" data-tooltip="Drone Fundo" aria-pressed="false">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 18V5l12-2v13" />
                    </svg>
                </button>
                <button id="clear" class="icon-btn" data-tooltip="Limpar Tela">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6" />
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                    </svg>
                </button>
            </div>
        </div>



        <footer data-lab-footer data-home-href="/"></footer>
    </div>

    <script src="/labs/shared.js?v=5" defer></script>
    <script src="script.js" defer></script>
</body>

</html>
